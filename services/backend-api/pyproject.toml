[project]
name = "backend-api"
version = "0.1.0"
description = "Multi-tenant Shopify-style SaaS backend API"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.24",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "psycopg[binary]>=3.2.0",
    "svix>=1.50.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.10.0",
    "cryptography>=44.0.0",
    "passlib[bcrypt]>=1.7.4",
    "clerk-backend-api>=4.2.0",
    "stripe>=11.4.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "greenlet>=3.5.2",
    "bcrypt<5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
