services:
  backend-api:
    build:
      context: ./services/backend-api
      dockerfile: Dockerfile
    container_name: ecommerce-backend-prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Core
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
      - APP_ENV=${APP_ENV:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      # Clerk (required)
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_WEBHOOK_SECRET=${CLERK_WEBHOOK_SECRET}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      # JWT (required)
      - JWT_SECRET=${JWT_SECRET}
      # Stripe (required for payments)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Redis (optional — rate limiting + caching)
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      # Exchange rates
      - EXCHANGE_RATE_PROVIDER=${EXCHANGE_RATE_PROVIDER:-frankfurter}
      # Email (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-noreply@yourplatform.com}
      # AI
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Error tracking
      - SENTRY_DSN=${SENTRY_DSN:-}
      # Doppler
      - DOPPLER_PR=${DOPPLER_PR:-prod}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_prod_data:
